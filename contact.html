<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .form-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 40px;
      max-width: 640px;
      width: 100%;
    }

    .form-container h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .form-container p.subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group label .required {
      color: #e74c3c;
      margin-left: 2px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
      background: #fff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-group .char-count {
      text-align: right;
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.98); }

    .hidden { display: none; }

    @media (max-width: 500px) {
      .form-row { flex-direction: column; gap: 0; }
      .form-container { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Contact Us</h1>
    <p class="subtitle">We'd love to hear from you. Fill out the form below and we'll get back to you shortly.</p>

    <form id="contactForm">
      <!-- Name -->
      <div class="form-group">
        <label>Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>

      <!-- Business Email -->
      <div class="form-group">
        <label>Business Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="you@company.com" required>
      </div>

      <!-- Business Contact Phone -->
      <div class="form-group">
        <label>Business Contact Phone # <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
      </div>

      <!-- Business Type -->
      <div class="form-group">
        <label>Business Type <span class="required">*</span></label>
        <input type="text" id="businessType" name="businessType" placeholder="e.g. Technology, Healthcare, Retail" required>
      </div>

      <!-- Services -->
      <div class="form-group">
        <label>Services <span class="required">*</span></label>
        <select id="services" name="services" required>
          <option value="" disabled selected>Select a service</option>
          <option value="QaaS">QaaS</option>
          <option value="Digital Marketing">Digital Marketing</option>
          <option value="SEO Optimization 4 Months Plan">SEO Optimization 4 Months Plan</option>
          <option value="Customized Services">Customized Services</option>
        </select>
      </div>

      <!-- Customized Services Input (conditionally visible) -->
      <div class="form-group hidden" id="customServiceGroup">
        <label>Describe Your Customized Service <span class="required">*</span></label>
        <input type="text" id="customService" name="customService" maxlength="200" placeholder="Describe the service you need (max 200 characters)">
        <div class="char-count"><span id="customServiceCount">0</span> / 200</div>
      </div>

      <!-- Country -->
      <div class="form-group">
        <label>Country <span class="required">*</span></label>
        <select id="country" name="country" required>
          <option value="" disabled selected>Select your country</option>
        </select>
      </div>

      <!-- State & Zip -->
      <div class="form-row">
        <div class="form-group">
          <label>State <span class="required">*</span></label>
          <select id="state" name="state" required disabled>
            <option value="" disabled selected>Select a state</option>
          </select>
        </div>
        <div class="form-group">
          <label>Zip Code</label>
          <input type="text" id="zipCode" name="zipCode" placeholder="Auto-populated" readonly>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Description</label>
        <textarea id="description" name="description" maxlength="500" placeholder="Tell us more about your requirements (max 500 characters)"></textarea>
        <div class="char-count"><span id="descriptionCount">0</span> / 500</div>
      </div>

      <button type="submit" class="btn-submit">Submit</button>
    </form>
  </div>

    // ── Populate country dropdown ──
    const countrySelect = document.getElementById('country');
    const stateSelect = document.getElementById('state');
    const zipInput = document.getElementById('zipCode');

    Object.keys(locationData).forEach(country => {
      const opt = document.createElement('option');
      opt.value = country;
      opt.textContent = country;
      countrySelect.appendChild(opt);
    });

    // ── Country change → populate states ──
    countrySelect.addEventListener('change', function () {
      const states = locationData[this.value];
      stateSelect.innerHTML = '<option value="" disabled selected>Select a state</option>';
      zipInput.value = '';

      if (states) {
        Object.keys(states).forEach(state => {
          const opt = document.createElement('option');
          opt.value = state;
          opt.textContent = state;
          stateSelect.appendChild(opt);
        });
        stateSelect.disabled = false;
      } else {
        stateSelect.disabled = true;
      }
    });

    // ── State change → auto-populate zip ──
    stateSelect.addEventListener('change', function () {
      const country = countrySelect.value;
      const state = this.value;
      if (locationData[country] && locationData[country][state]) {
        zipInput.value = locationData[country][state][0];
      }
    });

    // ── Services → show/hide custom input ──
    const servicesSelect = document.getElementById('services');
    const customGroup = document.getElementById('customServiceGroup');
    const customInput = document.getElementById('customService');

    servicesSelect.addEventListener('change', function () {
      if (this.value === 'Customized Services') {
        customGroup.classList.remove('hidden');
        customInput.required = true;
      } else {
        customGroup.classList.add('hidden');
        customInput.required = false;
        customInput.value = '';
        document.getElementById('customServiceCount').textContent = '0';
      }
    });

    // ── Character counters ──
    customInput.addEventListener('input', function () {
      document.getElementById('customServiceCount').textContent = this.value.length;
    });

    document.getElementById('description').addEventListener('input', function () {
      document.getElementById('descriptionCount').textContent = this.value.length;
    });

    // ── Form submit ──
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = Object.fromEntries(formData.entries());
      console.log('Form submitted:', data);
      alert('Thank you for contacting us! We will get back to you shortly.');
      this.reset();
      customGroup.classList.add('hidden');
      stateSelect.innerHTML = '<option value="" disabled selected>Select a state</option>';
      stateSelect.disabled = true;
      zipInput.value = '';
      document.getElementById('customServiceCount').textContent = '0';
      document.getElementById('descriptionCount').textContent = '0';
    });
  </script>
</body>
</html>
